<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness JSONL Viewer</title>
    <style>
      :root { --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #d7dce4; --muted: #8a93a3; --ok: #3fb950; --err: #f85149; --warn: #d29922; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 14px; margin: 0; font-weight: 600; }
      #drop { flex: 1; border: 1px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); cursor: pointer; }
      #drop.drag { border-color: var(--ok); color: var(--ok); }
      body.drag-over #drop { border-color: var(--ok); color: var(--ok); background: rgba(63,185,80,.10); }
      main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px; height: calc(100vh - 60px); }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
      .row { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid #20242e; }
      .indent { margin-left: 16px; }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      .warn { color: var(--warn); }
      .muted { color: var(--muted); }
      .bar { background: linear-gradient(90deg, var(--ok), var(--warn)); height: 12px; border-radius: 3px; min-width: 2px; }
      #summary b { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <h1>Harness JSONL Viewer</h1>
      <div id="drop">点击选择，或把 <code>.jsonl</code> 文件拖到页面任意位置（纯本地解析，不上传）</div>
    </header>
    <main>
      <section id="tree">
        <h2>Span 树 / 时间线</h2>
        <div id="treeBody"><p class="muted">等待文件…</p></div>
      </section>
      <section id="side">
        <h2>摘要 / 趋势</h2>
        <div id="summary"><p class="muted">等待文件…</p></div>
      </section>
    </main>
    <script src="./viewer-core.js" defer></script>
    <script src="./viewer.mjs" defer></script>
  </body>
</html>
